[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Absolute minimum footprint for a portfolio demo
numReplicas = 1
# Scale to zero after ~10 min with no outbound traffic (biggest credit saver)
sleepApplication = true
# Health only at deploy time — use a cheap path that does not touch LLM/IO
healthcheckPath = "/health"
healthcheckTimeout = 45
restartPolicyType = "ON_FAILURE"
# Avoid burn from crash-loop restarts
restartPolicyMaxRetries = 1
# Never double-bill old + new containers during a deploy
overlapSeconds = 0
drainingSeconds = 0

# Hard caps so a spike cannot drain credits (billed usage is still actual RAM/CPU)
[deploy.limitOverride.containers]
cpu = 0.5
memoryBytes = 268435456

